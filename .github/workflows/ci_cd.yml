name: Build and test
on:
  push:
    branches: [main, free-alt-tab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select baseline Xcode
        if: matrix.runner == 'xcode-27'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - run: xcodebuild -version
      - run: python3 scripts/check_project.py
      - run: python3 scripts/l10n/validate_localizations.py
      - run: python3 scripts/assets/compile_illustrations.py --check
      - run: python3 scripts/assets/test_compile_illustrations.py
      - run: scripts/check_import.sh
      - name: Build Debug
        run: xcodebuild -project alt-tab-macos.xcodeproj -scheme Debug -configuration Debug -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build Release
        run: xcodebuild -project alt-tab-macos.xcodeproj -scheme Release -configuration Release -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Run unit tests
        run: xcodebuild test -project alt-tab-macos.xcodeproj -scheme Test -configuration Debug -derivedDataPath DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
